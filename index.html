<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запись</title>
<style>
body{background:#111;color:#fff;font-family:Arial}
input,select,button{padding:10px;margin:6px 0;width:320px;max-width:90%;border-radius:8px}
.row{display:flex;gap:10px}
</style>
</head>
<body>

<h3>Запись</h3>

<label>Мастер</label><br>
<select id="master"></select><br>

<label>Дата</label><br>
<input type="date" id="date"><br>

<label>Время</label><br>
<select id="time"><option>Сначала мастер + дата</option></select><br>

<label>Имя</label><br>
<input id="name"><br>

<label>Телефон</label><br>
<input id="phone" placeholder="+7700..."><br>

<div class="row">
<button id="btn">Записаться</button>
<button id="btnCancel">Отменить</button>
</div>

<p id="msg"></p>

<script>
const API="ТВОЙ_EXEC_URL";

const MASTERS=["Ержан","Айдар","Алия"];
const TIMES=["09:00","09:30","10:00","10:30","11:00","11:30","12:00","14:00","14:30","15:00","15:30","16:00","16:30","17:00"];

const masterEl=document.getElementById("master");
const dateEl=document.getElementById("date");
const timeEl=document.getElementById("time");
const nameEl=document.getElementById("name");
const phoneEl=document.getElementById("phone");
const msgEl=document.getElementById("msg");
const btn=document.getElementById("btn");
const btnCancel=document.getElementById("btnCancel");

MASTERS.forEach(m=>{
 let o=document.createElement("option");
 o.value=o.textContent=m;
 masterEl.appendChild(o);
});

function normPhone(v){return String(v||"").replace(/[^\d]/g,"");}
function weekend(d){return[0,6].includes(new Date(d+"T00").getDay());}

masterEl.onchange=dateEl.onchange=loadTimes;

function loadTimes(){
 if(!masterEl.value||!dateEl.value){timeEl.innerHTML="<option>Сначала мастер + дата</option>";return;}
 if(weekend(dateEl.value)){msgEl.textContent="Выходной";return;}
 fetch(`${API}?action=busy&date=${dateEl.value}&master=${encodeURIComponent(masterEl.value)}`)
 .then(r=>r.json()).then(j=>{
  timeEl.innerHTML="";
  TIMES.forEach(t=>{if(!j.busy.includes(t)){let o=document.createElement("option");o.value=o.textContent=t;timeEl.appendChild(o);}});
 });
}

btn.onclick=async()=>{
 const m=masterEl.value,d=dateEl.value,t=timeEl.value,n=nameEl.value.trim(),p=normPhone(phoneEl.value);
 if(!m||!d||!t||!n||!p){msgEl.textContent="Заполните всё";return;}
 let r=await fetch(`${API}?action=book&date=${d}&time=${t}&name=${encodeURIComponent(n)}&phone=${p}&master=${encodeURIComponent(m)}`);
 let j=await r.json();
 msgEl.textContent=j.ok?"✅ Записано":"⛔ Занято";
 loadTimes();
};

btnCancel.onclick=async()=>{
 const m=masterEl.value,d=dateEl.value,p=normPhone(phoneEl.value);
 if(!m||!d||!p){msgEl.textContent="Выберите мастера, дату и телефон";return;}
 let r=await fetch(`${API}?action=cancel&date=${d}&phone=${p}&master=${encodeURIComponent(m)}`);
 let j=await r.json();
 msgEl.textContent=j.ok?"❌ Отменено":"Не найдено";
 loadTimes();
};
</script>
</body>
</html>
