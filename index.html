<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запись на приём</title>
  <style>
    body{
      background: url("bg2.png") center/cover no-repeat fixed;
      color: white;
      font-family: Arial, sans-serif;
    }
    input, select, button{
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.3);
      margin: 6px 0;
      width: min(360px, 92vw);
      box-sizing: border-box;
    }
    button{ cursor: pointer; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .row button{ width: min(175px, calc(46vw - 10px)); }
  </style>
</head>
<body>

<h2>Запись на приём</h2>

<label>Дата:</label><br>
<input type="date" id="date"><br><br>

<label>Время:</label><br>
<select id="time">
  <option value="">Сначала выберите дату</option>
</select><br><br>

<label>Имя:</label><br>
<input id="name"><br><br>

<label>Телефон:</label><br>
<input id="phone" placeholder="+7700..."><br><br>

<div class="row">
  <button id="btn">Записаться</button>
  <button id="btnCancel" type="button">Отменить запись</button>
</div>

<p id="msg"></p>

<script>
const API = "https://script.google.com/macros/s/AKfycbwSicOz5m6nKOAFuKAj-_k2os9A5Zdi9ZAdxDNFiG3lnBrs1GbTbTfT0XwBpre7cHs/exec";

const TIMES = [
  "09:00","09:30","10:00","10:30",
  "11:00","11:30","12:00","12:30",
  "14:00","14:30","15:00","15:30",
  "16:00","16:30","17:00"
];

const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");
const nameEl = document.getElementById("name");
const phoneEl = document.getElementById("phone");
const msgEl  = document.getElementById("msg");
const btnEl  = document.getElementById("btn");
const btnCancelEl = document.getElementById("btnCancel");

// 0=вс, 6=сб
function isWeekend(yyyy_mm_dd){
  const d = new Date(yyyy_mm_dd + "T00:00:00");
  const day = d.getDay();
  return day === 0 || day === 6;
}

dateEl.addEventListener("change", () => {
  if (!dateEl.value) return;

  if (isWeekend(dateEl.value)) {
    msgEl.textContent = "Выходной день. Выберите будний день.";
    dateEl.value = "";
    timeEl.innerHTML = "<option value=''>Сначала выберите дату</option>";
    return;
  }

  loadTimes();
});

btnEl.addEventListener("click", book);
btnCancelEl.addEventListener("click", cancelBooking);

function loadTimes() {
  const date = dateEl.value;
  msgEl.textContent = "";

  if (!date) {
    timeEl.innerHTML = "<option value=''>Сначала выберите дату</option>";
    return;
  }
  if (isWeekend(date)) {
    msgEl.textContent = "Выходной день. Выберите будний день.";
    dateEl.value = "";
    timeEl.innerHTML = "<option value=''>Сначала выберите дату</option>";
    return;
  }

  timeEl.innerHTML = "<option>Загрузка...</option>";

  fetch(`${API}?action=busy&date=${encodeURIComponent(date)}`)
    .then(r => r.text())
    .then(txt => JSON.parse(txt))
    .then(data => {
      const busy = (data.busy || []).map(x => String(x).trim());
      timeEl.innerHTML = "";

      TIMES.forEach(t => {
        if (!busy.includes(t)) {
          const o = document.createElement("option");
          o.value = t;
          o.textContent = t;
          timeEl.appendChild(o);
        }
      });

      if (!timeEl.options.length) {
        timeEl.innerHTML = "<option value=''>Нет свободного времени</option>";
      }
    })
    .catch(() => {
      timeEl.innerHTML = "<option value=''>Ошибка загрузки</option>";
    });
}

async function fetchWithTimeout(url, ms = 12000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try{
    const r = await fetch(url, { signal: controller.signal });
    const txt = await r.text();
    return { ok: r.ok, status: r.status, txt };
  } finally {
    clearTimeout(timer);
  }
}

function normalizePhone(raw){
  // оставляем цифры и +, убираем пробелы/скобки/дефисы
  return String(raw || "").trim().replace(/[^\d+]/g, "");
}

async function book() {
  const date = dateEl.value;
  const time = timeEl.value;
  const name = nameEl.value.trim();
  const phone = normalizePhone(phoneEl.value);

  if (!date) { msgEl.textContent = "Выберите дату."; return; }
  if (isWeekend(date)) { msgEl.textContent = "Выходной день. Выберите будний день."; return; }
  if (!time) { msgEl.textContent = "Выберите время."; return; }
  if (!name || !phone) { msgEl.textContent = "Введите имя и телефон."; return; }

  btnEl.disabled = true;
  btnCancelEl.disabled = true;
  msgEl.textContent = "Записываю...";

  const url =
    API +
    "?action=book" +
    "&date=" + encodeURIComponent(date) +
    "&time=" + encodeURIComponent(time) +
    "&name=" + encodeURIComponent(name) +
    "&phone=" + encodeURIComponent(phone);

  try{
    const { status, txt } = await fetchWithTimeout(url, 12000);

    let res;
    try{
      res = JSON.parse(txt);
    } catch(e){
      msgEl.textContent = "❌ Сервер вернул не-JSON (status " + status + "): " + txt.slice(0, 120);
      return;
    }

    if (res.ok) {
      msgEl.textContent = "✅ Запись сохранена";
      loadTimes();
    } else if (res.error === "SLOT_BUSY") {
      msgEl.textContent = "⛔ Это время уже занято";
      loadTimes();
    } else {
      msgEl.textContent = "❌ Ошибка: " + (res.error || "UNKNOWN");
    }

  } catch(e){
    msgEl.textContent = (e.name === "AbortError")
      ? "⏳ Сервер долго отвечает (таймаут). Проверь Apps Script."
      : "❌ Ошибка связи: " + e.message;
  } finally {
    btnEl.disabled = false;
    btnCancelEl.disabled = false;
  }
}

async function cancelBooking() {
  const date = dateEl.value;
  const phone = normalizePhone(phoneEl.value);

  if (!date) { msgEl.textContent = "Выберите дату."; return; }
  if (isWeekend(date)) { msgEl.textContent = "Выходной день. Выберите будний день."; return; }
  if (!phone) { msgEl.textContent = "Введите телефон."; return; }

  if (!confirm(`Отменить запись на ${date} для телефона ${phone}?`)) return;

  btnEl.disabled = true;
  btnCancelEl.disabled = true;
  msgEl.textContent = "Отменяю запись...";

  const url =
    API +
    "?action=cancel" +
    "&date=" + encodeURIComponent(date) +
    "&phone=" + encodeURIComponent(phone);

  try{
    const { status, txt } = await fetchWithTimeout(url, 12000);

    let res;
    try{
      res = JSON.parse(txt);
    } catch(e){
      msgEl.textContent = "❌ Сервер вернул не-JSON (status " + status + "): " + txt.slice(0, 120);
      return;
    }

    if (res.ok) {
      msgEl.textContent = "✅ Запись отменена";
      loadTimes();
    } else if (res.error === "NOT_FOUND") {
      msgEl.textContent = "⛔ Запись не найдена (проверь дату и телефон)";
      loadTimes();
    } else {
      msgEl.textContent = "❌ Ошибка: " + (res.error || "UNKNOWN");
    }

  } catch(e){
    msgEl.textContent = (e.name === "AbortError")
      ? "⏳ Сервер долго отвечает (таймаут). Проверь Apps Script."
      : "❌ Ошибка связи: " + e.message;
  } finally {
    btnEl.disabled = false;
    btnCancelEl.disabled = false;
  }
}
</script>

</body>
</html>
